[workspace]
resolver = "3"
members = [
    "crates/bwoc-core",
    "crates/bwoc-signing",
    "crates/bwoc-a2a",
    "crates/bwoc-cli",
    "crates/bwoc-agent",
    "crates/bwoc-harness",
    "crates/bwoc-tui",
    "crates/bwoc-mqtt",
    "crates/bwoc-deep-memory",
    "crates/bwoc-connect",
]

[workspace.package]
version = "2.38.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/bmt-bwol-ops/bwoc-framwork"

[workspace.dependencies]
bwoc-core = { path = "crates/bwoc-core" }
bwoc-signing = { path = "crates/bwoc-signing" }
bwoc-a2a = { path = "crates/bwoc-a2a" }
bwoc-tui = { path = "crates/bwoc-tui" }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
ratatui = "0.30"
crossterm = "0.29"
ctrlc = "3"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
fluent-bundle = "0.16"
unic-langid = "0.9"
include_dir = "0.7"
thiserror = "2"
sha2 = "0.10"
# A2A HTTP transport (#48 P1-serve). Isolated to bwoc-a2a — NEVER bwoc-core
# (dep-quarantine HARD RULE). tokio uses a current-thread runtime created inside
# bwoc-a2a so the CLI stays synchronous.
axum = "0.8"
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
# SSE streaming (#48 P3) — `async_stream::stream!` builds the event stream.
async-stream = "0.3"
futures-core = "0.3"
# Outbound A2A client (#48 P4) — rustls so there's no system OpenSSL dependency.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Tier 2 deep-memory reference impl. Isolated to bwoc-deep-memory — NEVER
# bwoc-core (dep-quarantine HARD RULE). `bundled` compiles SQLite from source so
# the CI matrix needs no system libsqlite3.
rusqlite = { version = "0.32", features = ["bundled"] }
# Secret redaction on `mine` (deep-memory). Pure-Rust (no C extension / no
# Windows-CI concern). Isolated to bwoc-deep-memory — NEVER bwoc-core.
regex = "1"
# Windows named-pipe transport for the daemon IPC (bwoc-agent --serve + the
# ping/status/stop clients). cfg(windows)-only in bwoc-agent / bwoc-cli — the
# Unix path stays on std's UnixListener/UnixStream, and bwoc-core never takes
# it (dep-quarantine HARD RULE).
interprocess = "2.2"
# Property-based testing — DEV-DEPENDENCY ONLY. Used by bwoc-core (trust fuzz)
# and bwoc-harness (ingress-labeling invariants). Never a normal dependency:
# the dep-quarantine keeps bwoc-core's runtime graph to serde/toml/thiserror.
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
