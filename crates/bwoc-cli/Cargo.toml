[package]
name = "bwoc-cli"
description = "The bwoc CLI — incarnate, check, spawn, and control BWOC agents. Native binary for macOS, Linux, and Windows. Localized output (TH, EN)."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "bwoc"
path = "src/main.rs"

[dependencies]
bwoc-core = { workspace = true }
bwoc-signing = { workspace = true }
bwoc-tui = { workspace = true }
bwoc-loop-tui = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
ctrlc = { workspace = true }
libc = "0.2"
unicode-width = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
fluent-bundle = { workspace = true }
unic-langid = { workspace = true }
include_dir = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
# `bwoc eval` runs a fixture in an auto-cleaned isolated work dir; the smoke
# test (tests/smoke.rs) also uses it (a regular dep is visible to tests too).
tempfile = "3"

[target.'cfg(windows)'.dependencies]
interprocess = { workspace = true }
