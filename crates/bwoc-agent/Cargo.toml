[package]
name = "bwoc-agent"
description = "Per-agent BWOC daemon — control endpoint, trust- and signature-gated inbox, Saṅgha task watch, and supervision of network-facing children."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "bwoc-agent"
path = "src/main.rs"

[dependencies]
bwoc-core = { workspace = true }
bwoc-signing = { workspace = true }
fluent-bundle = { workspace = true }
unic-langid = { workspace = true }
ctrlc = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
# Signature-verification tests generate ephemeral keypairs in a tempdir.
tempfile = "3"

[target.'cfg(windows)'.dependencies]
interprocess = { workspace = true }
