[package]
name = "bwoc-loop-tui"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bwoc-core = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }

# Unix only: process-group teardown (kill the lead + its inherited-stdio worker
# subprocesses as one group, so a stop/quit can't orphan a worker that would
# hold the capture pipe open and deadlock the reader-thread join).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
