[package]
name = "bwoc-harness"
description = "BWOC self-hosted agentic harness — OpenAI-compatible provider, agentic loop, core tools, P3 task queue + telemetry + tool-auth."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "bwoc-harness"
path = "src/main.rs"

# Phase 5 t7a — the hostile turn-executor child (red-team). Built ONLY under the
# `test-redteam` feature (required-features); the `sandbox_escape` gate spawns it
# inside the executor FS jail and asserts every escape it attempts fails. Never
# part of a normal build/ship.
[[bin]]
name = "sandbox_redteam"
path = "src/bin/sandbox_redteam.rs"
required-features = ["test-redteam"]

# ---------------------------------------------------------------------------
# Feature flags
# ---------------------------------------------------------------------------
[features]
# Optional OpenTelemetry export.  The default build has ZERO OTEL deps.
# Enable with: cargo build --features otel
# Pulls the OTEL crate graph (heavy + network egress) ONLY under this feature —
# the dep-quarantine holds for the default build.
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]

# Computer-use headless-browser executor (Phase 6/7). The default build has ZERO
# browser deps — the action→CDP mapping in `tools::browser` is pure and always
# compiled/tested; only the live `BrowserExecutor` (chromiumoxide + a runtime
# Chrome/Chromium) is gated here. Enable with: cargo build --features browser
browser = ["dep:chromiumoxide"]

# Phase 5 t7a — gate-only red-team suite (the hostile-child bin above +
# `tests/sandbox_escape.rs`). Off by default; the gate enables it explicitly:
#   cargo test -p bwoc-harness --features test-redteam --test sandbox_escape
test-redteam = []

[dependencies]
# Lean shared types — bwoc-core carries only serde/toml/thiserror.
# This dep does NOT violate the dep-quarantine invariant.
bwoc-core = { path = "../bwoc-core" }

# OpenTelemetry — OPTIONAL, behind the `otel` feature only (heavy + network
# egress). Dep-quarantine: these never enter the default build.
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"], optional = true }

# Headless-browser computer-use executor — OPTIONAL, behind the `browser`
# feature only (pulls a CDP/WebSocket crate graph + needs a runtime Chrome).
# Dep-quarantine: never enters the default build, never bwoc-core.
chromiumoxide = { version = "0.9", optional = true }

# Async runtime — required for streaming + concurrent tool execution + queue
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "io-std", "time"] }
# Cancellation token for the task queue (CancellationToken is in the default feature set)
tokio-util = "0.7"
# HTTP client for OpenAI-compat endpoint
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Error handling
thiserror = "2"
# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }
# Futures utilities (stream combinators)
futures-util = "0.3"
# Byte manipulation for SSE parsing
bytes = "1"
# Async trait support
async-trait = "0.1"

# TOML config parsing for .bwoc/harness-policy.toml
toml = "0.8"

# Per-turn throwaway cwd for the isolated turn-executor child (Phase 5 t5).
# Promoted from dev-dependency: the parent now creates a tempdir at runtime.
tempfile = "3"

# OS keyring — scoped credential store for tool authentication.
# Heavy dep (platform integration): lives in bwoc-harness ONLY per dep-quarantine.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

# ---------------------------------------------------------------------------
# Platform-specific dependencies
# ---------------------------------------------------------------------------
# Raw syscalls for the Phase 5 t5 turn-executor `pre_exec` (dup2/fcntl/close).
# Unix-only and dep-quarantined to bwoc-harness; bwoc-core stays untouched.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Landlock LSM bindings for kernel-enforced filesystem access control.
# Allowed here: bwoc-harness is the dep-quarantine crate for heavy/platform deps.
landlock = "0.4"
# Phase 5 t11 — pure-Rust seccomp-bpf compiler (Firecracker). NOT libseccomp
# (no C dep, no FFI to a system lib). Compiles the egress deny-set filter in the
# parent; installed in the child's pre_exec. Dep-quarantined to bwoc-harness.
seccompiler = "0.5"

[dev-dependencies]
# HTTP mock server for offline provider tests
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tempfile = "3"
# Ingress-labeling invariant fuzz (Phase 5 t1). Dev-only.
proptest = { workspace = true }

# Process-liveness check (kill(pid,0)) for the t5 reap/no-zombie test.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
