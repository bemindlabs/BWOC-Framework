[package]
name = "bwoc-connect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Chat connectors (Telegram first) bridging external platforms to BWOC agents. Quarantines the network deps so bwoc-cli/agent/core stay lean."

[[bin]]
name = "bwoc-connect"
path = "src/main.rs"

[lib]
name = "bwoc_connect"
path = "src/lib.rs"

[dependencies]
# Lean shared types (chat_proto + team) — bwoc-core carries only serde/toml/thiserror.
bwoc-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
# Network deps live HERE (dep-quarantine): nothing on the `bwoc` CLI / agent /
# core path pulls these in. `tokio` is the workspace base + the extra features
# this crate needs (subprocess management + piped stdio).
tokio = { workspace = true, features = ["rt-multi-thread", "process", "io-util", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Discord gateway (websocket). rustls-only — no native TLS, matches reqwest.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# LINE connector: inbound webhook server (axum on the shared hyper/tokio stack) +
# HMAC-SHA256 signature verification (hmac/sha2) + base64 for the signature header.
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

# Token resolution via the OS keyring (chat-connectors). macOS/Windows use the
# native secret stores. Linux is intentionally NOT wired to Secret Service: that
# path pulls libdbus (a system C lib, absent on CI) or, via zbus, a second async
# runtime — heavy for a feature the headless deployment target doesn't use (no
# Secret Service daemon there → it falls back to the env var anyway). So Linux is
# env-only; the env var is the fallback on every platform (Mattaññutā — right
# amount, not every-platform-completeness). See `keyring_lookup` in main.rs.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
