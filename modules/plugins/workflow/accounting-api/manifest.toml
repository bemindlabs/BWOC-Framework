[plugin]
name        = "accounting-api"
kind        = "workflow"
version     = "0.1.0"
description = "Bemind Accounting Open API adapter — read financial reports (reports:read); record purchases/expenses (2-step /purchase-docs bill flow + /expenses); and cover the sales (quick-sales + open invoices), stock (balances, movements, receipts, adjustments), and cashbook (GL journals) domains. Every write auto-posts a double-entry GL entry server-side. Bearer-key auth (operator-supplied, never committed) + a required User-Agent. Write gating lives at the `bwoc accounting` CLI (writes_enabled opt-in + per-write confirm), never in this plugin."
compat      = ">=2.36.0"
entry       = "accounting.sh"

# [config.schema] intentionally omitted.
#
# This plugin holds no config of its own. The API key resolves at runtime from
# BWOC_ACCOUNTING_KEY (env) or <workspace>/.bwoc/secrets/accounting-key (file,
# gitignored) — never from workspace config, never committed. See auth.toml for
# the credential shape (no values). The API key is bound to one seller; the
# plugin never reads or prints the key value.
#
# Read verbs (`report`) are free. Write verbs (`bill-create`, `bill-update`,
# `expense-create`) produce durable, GL-posting side-effects on an external
# system of record; their gate lives at the `bwoc accounting` CLI (PLUGINS
# §Write verbs) — a standing `writes_enabled` opt-in plus a per-write confirm.
# The plugin executes when invoked and never re-implements nor bypasses it.
