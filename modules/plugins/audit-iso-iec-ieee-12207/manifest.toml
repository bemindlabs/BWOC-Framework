[plugin]
name        = "audit-iso-iec-ieee-12207"
kind        = "audit"
version     = "0.1.0"
description = "ISO/IEC/IEEE 12207 Software Life Cycle Processes audit — attestation runtime. A jointly ISO + IEC + IEEE published standard defining the process framework for software life cycles (agreement, organizational, technical-management, and technical processes)."
compat      = ">=2.36.0"
entry       = "audit.sh"

# [config.schema] intentionally omitted. Adopts the per-criterion attestation
# block on the workspace's [[plugins.audit-iso-iec-ieee-12207.attestations]]
# array (criterion_id + statement + signer + signed_at + optional
# valid_through) — the same shape as the ISO 9001 / ISO/IEC 27001 / ISO/IEC/IEEE
# 29148 lanes, documented in SPEC.md §Configuration, not as a manifest schema.
# The universal `enabled` key on `[plugins.audit-iso-iec-ieee-12207]` is the
# only manifest-declared surface.
