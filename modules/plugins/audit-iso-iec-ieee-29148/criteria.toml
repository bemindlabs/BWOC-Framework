# ISO/IEC/IEEE 29148:2018 — declared criteria (v0.1.0 attestation runtime).
#
# Source: ISO/IEC/IEEE 29148:2018 — Systems and software engineering — Life
# cycle processes — Requirements engineering. A jointly published standard of
# **ISO, IEC, and IEEE** (it supersedes IEEE 830 / IEEE 1233 / IEEE 1362). See
# SPEC.md for the full citation set. Clause numbers refer to the published
# standard's sections; `5.2.x` are requirement/requirement-set characteristics,
# `9.x` are the information items (StRS / SyRS / SRS).
#
# Each `[criterion.<id>]` table documents one requirements-engineering practice
# the runtime checks. `id` is kebab-case and plugin-scoped (BWOC-11). Declaration
# order is the report order — do not reorder casually; renames are a major
# version bump (PLUGINS.en.md §Stability).
#
# Fields:
#   severity     — closed enum {info, low, medium, high, critical}.
#   clause       — ISO/IEC/IEEE 29148:2018 clause reference (e.g. "5.2.6", "9.4").
#   title        — short clause title.
#   description  — one-line operator-facing summary of what the runtime checks.
#
# audit.sh backs these criteria with the attestation runtime (shared with the
# ISO 9001 / ISO/IEC 27001 lanes): each criterion resolves to `pass`/`fail` from
# signed attestation evidence in `.bwoc/workspace.toml` (missing or incomplete
# attestation → `fail`).

[criterion.29148-stakeholder-requirements]
severity    = "high"
clause      = "9.4"
title       = "Stakeholder requirements (StRS)"
description = "Stakeholder needs and requirements are elicited and recorded in a Stakeholder Requirements Specification."

[criterion.29148-system-software-requirements]
severity    = "high"
clause      = "9.5/9.6"
title       = "System / software requirements (SyRS / SRS)"
description = "System and software requirements are specified in a SyRS / SRS derived from the stakeholder requirements."

[criterion.29148-requirement-characteristics]
severity    = "high"
clause      = "5.2.6"
title       = "Individual requirement characteristics"
description = "Each requirement is necessary, appropriate, unambiguous, complete, singular, feasible, verifiable, correct, and conforming."

[criterion.29148-requirement-set-characteristics]
severity    = "medium"
clause      = "5.2.7"
title       = "Requirement set characteristics"
description = "The requirement set is complete, consistent, feasible, comprehensible, and able to be validated."

[criterion.29148-verifiability]
severity    = "high"
clause      = "5.2.6"
title       = "Verifiability of requirements"
description = "Each requirement has a defined verification method (inspection, analysis, demonstration, or test)."

[criterion.29148-traceability]
severity    = "high"
clause      = "5.2.8"
title       = "Bidirectional traceability"
description = "Bidirectional traceability is maintained from stakeholder to system to software requirements and on to verification."

[criterion.29148-requirements-management]
severity    = "medium"
clause      = "6.5"
title       = "Requirements management"
description = "Requirements are baselined and changes are controlled through a defined change-management process."
