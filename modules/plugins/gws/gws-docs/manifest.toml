[plugin]
name        = "gws-docs"
kind        = "gws"
version     = "0.1.0"
description = "gws plugin — Google Docs adapter with an in-place WRITE path: reads a document (documents.get) and edits it via documents.batchUpdate — the general write verb — plus the convenience replace-all-text. Projects reads into the normative Google Doc shape. The first write-capable gws service: its write verbs (batch-update, replace-all-text) carry the operator-confirm gate at the `bwoc gws` boundary. Sources the OAuth credential helpers from the sibling gws-auth foundation; requires the documents scope."
compat      = ">=2.33.0"
entry       = "gws.sh"

# [config.schema] intentionally omitted.
#
# This plugin holds no config of its own. Credentials resolve at runtime through
# the sibling gws-auth foundation (BWOC_GWS_TOKEN env / .bwoc/secrets/gws-token.json),
# never from workspace config. The only workspace-level surface is the universal
# `enabled` key on [plugins.gws-docs]. See SPEC.md §Configuration.
#
# Unlike the read-mostly gws-drive/gmail/calendar plugins, gws-docs has a WRITE
# path (documents.batchUpdate). The write is gated at the `bwoc gws docs` CLI
# boundary (operator-confirm gate, PLUGINS §Write verbs) — the plugin executes
# when invoked and never re-implements nor bypasses that gate.
