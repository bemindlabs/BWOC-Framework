[plugin]
name        = "gws-sheets"
kind        = "gws"
version     = "0.1.0"
description = "gws plugin — Google Sheets adapter with a WRITE path: reads spreadsheet metadata (spreadsheets.get) and cell ranges (spreadsheets.values.get), and edits values via spreadsheets.values.update / spreadsheets.values.append. Reads project into the normative Google Spreadsheet shape. Its write verbs (values-update, values-append) carry the operator-confirm gate at the `bwoc gws sheets` boundary. Sources the OAuth credential helpers from the sibling gws-auth foundation; requires the spreadsheets scope."
compat      = ">=2.33.0"
entry       = "gws.sh"

# [config.schema] intentionally omitted — no plugin-local config. Credentials
# resolve at runtime through the sibling gws-auth foundation (BWOC_GWS_TOKEN env
# / .bwoc/secrets/gws-token.json), never from workspace config. The write verbs
# (values-update, values-append) are gated at the `bwoc gws sheets` CLI boundary
# (operator-confirm gate, PLUGINS §Write verbs) — the plugin never re-implements
# nor bypasses that gate.
